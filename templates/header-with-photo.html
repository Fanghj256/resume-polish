<!-- 用此片段替换 resume.html 中的 .header。照片是用户项目内的相对路径；
     编辑层会自动把 <img> 设为不可编辑，这里再标注一次以防脚本未加载时被误删。
     只有手机号与邮箱需要包 <span class="pii">，正文里的链接不要包。
     页首从紧：照片默认 21 × 28mm（3:4），整页余量优先留给正文；
     空间紧张时继续缩照片，不要放大照片或拉大页首留白来填版。 -->
<div class="header" style="align-items:center;padding-bottom:4px;margin-bottom:6px">
  <div class="header-left" style="min-width:0;max-width:calc(100% - 28mm)">
    <div class="name">{{name}}</div>
    <div class="contact"><span class="pii">{{phone}}</span><span class="sep">|</span><span class="pii">{{email}}</span></div>
    <div class="target" style="font-size:13.2pt;font-weight:700;margin-top:7px">意向岗位：{{target_position}}</div>
  </div>
  <img src="{{portrait_relative_path}}" alt="本人商务照" contenteditable="false" style="width:21mm;height:28mm;object-fit:cover;object-position:center;flex-shrink:0">
</div>
